<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2A1A11">
  <title>Wedding Invitation</title>
  <meta name="description" content="Wedding invitation">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Great+Vibes&family=Pinyon+Script&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>document.documentElement.classList.add("js", "intro-active");</script>
</head>

<body>

  <!-- Closed invitation card: tap to open -->
  <div class="intro" id="intro" role="button" tabindex="0">
    <!-- Envelope photo mode (used when cfg.intro.image exists) -->
    <div class="intro-envelope">
      <div class="intro-video-wrap">
        <video id="introVideo" muted playsinline preload="auto" aria-hidden="true"></video>
      </div>
      <img id="introImg" alt="" decoding="async">
      <p class="intro-hint" data-i18n="introHint"></p>
    </div>

    <!-- Envelope built in CSS (used when there is no envelope photo) -->
    <div class="intro-card">
      <p class="eyebrow" data-i18n="invitation"></p>
      <div class="env" aria-hidden="true">
        <div class="env-back"></div>
        <div class="env-letter">
          <span class="letter-mono"><span class="mono-a"></span><span class="amp">&amp;</span><span
              class="mono-b"></span></span>
        </div>
        <div class="env-front"></div>
        <div class="env-flap"></div>
        <div class="seal">
          <span class="seal-letters"><span class="mono-a"></span><span class="amp">&amp;</span><span
              class="mono-b"></span></span>
        </div>
      </div>
      <p class="intro-hint" data-i18n="introHint"></p>
    </div>
  </div>

  <!-- Fixed music toggle. The audio only starts after the guest taps it. -->
  <button class="music-btn" id="musicBtn" type="button" aria-pressed="false">
    <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M9 18V6l10-2v12M9 18a3 3 0 1 1-3-3 3 3 0 0 1 3 3Zm10-2a3 3 0 1 1-3-3 3 3 0 0 1 3 3Z" fill="none"
        stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M8 5v14M16 5v14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
    </svg>
  </button>

  <main>

    <!-- 1. Hero -->
    <section class="screen hero" id="hero">
      <img class="logo reveal" id="logo" alt="" width="440" height="440" decoding="async">
      <p class="eyebrow reveal" style="--d:.1s" data-i18n="invitation"></p>
      <h1 class="names reveal" style="--d:.25s" id="names"></h1>
      <p class="lead verse reveal" style="--d:.4s" data-i18n="tagline"></p>
      <p class="date-line reveal" style="--d:.55s" id="heroDate"></p>
      <button class="scroll-down" type="button" data-next="calendar"><svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
            stroke-linejoin="round" />
        </svg></button>
    </section>

    <!-- 2. Calendar -->
    <section class="screen" id="calendar">
      <h2 class="title title-script reveal" data-i18n="calendarTitle"></h2>
      <div class="divider reveal" style="--d:.1s" aria-hidden="true"><i></i><b></b><i></i></div>
      <p class="month reveal" style="--d:.15s" id="monthTitle"></p>
      <div class="calendar reveal" style="--d:.25s" id="calendarGrid"></div>
      <button class="scroll-down" type="button" data-next="countdown"><svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
            stroke-linejoin="round" />
        </svg></button>
    </section>

    <!-- 3. Countdown -->
    <section class="screen" id="countdown">
      <h2 class="title reveal" data-i18n="countdownTitle"></h2>
      <div class="divider reveal" style="--d:.1s" aria-hidden="true"><i></i><b></b><i></i></div>
      <div class="countdown reveal" style="--d:.2s" id="countdownBoxes" role="timer" aria-live="off"></div>
      <p class="lead reveal" style="--d:.3s" id="countdownDone" hidden></p>
      <button class="scroll-down" type="button" data-next="venue"><svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
            stroke-linejoin="round" />
        </svg></button>
    </section>

    <!-- 4. Venue -->
    <section class="screen" id="venue">
      <h2 class="title reveal" data-i18n="venueTitle"></h2>
      <div class="divider reveal" style="--d:.1s" aria-hidden="true"><i></i><b></b><i></i></div>
      <svg class="pin reveal" style="--d:.15s" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 21s-7-6.1-7-11.5A7 7 0 0 1 19 9.5C19 14.9 12 21 12 21Z" fill="none" stroke="currentColor"
          stroke-width="1.4" stroke-linejoin="round" />
        <circle cx="12" cy="9.5" r="2.4" fill="none" stroke="currentColor" stroke-width="1.4" />
      </svg>
      <p class="venue-name reveal" style="--d:.25s" id="venueName"></p>
      <p class="lead reveal" style="--d:.35s" id="venueAddress"></p>
      <p class="date-line reveal" style="--d:.45s" id="venueDate"></p>
      <a class="btn reveal" style="--d:.55s" id="mapsBtn" target="_blank" rel="noopener noreferrer"
        data-i18n="openMaps"></a>
      <button class="scroll-down" type="button" data-next="closing"><svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
            stroke-linejoin="round" />
        </svg></button>
    </section>

    <!-- 6. Closing -->
    <section class="screen closing" id="closing">
      <svg class="heart reveal" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 21s-8.5-5.6-8.5-11.3A4.7 4.7 0 0 1 12 7a4.7 4.7 0 0 1 8.5 2.7C20.5 15.4 12 21 12 21Z"
          fill="currentColor" />
      </svg>
      <h2 class="title reveal" style="--d:.15s" data-i18n="closingTitle"></h2>
      <p class="lead reveal" style="--d:.3s" data-i18n="closingText"></p>
      <p class="names small reveal" style="--d:.45s" id="closingNames"></p>
    </section>

  </main>

  <script src="script.js"></script>
</body>

</html>
